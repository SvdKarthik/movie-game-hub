<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Setup | Movie Game Hub</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/setup.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="dashboard.html">Movie Game Hub</a>
  </header>

  <main class="page setup-page">
    <section class="setup-panel">
      <p class="eyebrow">Ready Up</p>
      <h1 data-setup-title>Game Setup</h1>

      <p class="setup-note" data-setup-note></p>

      <form data-setup-form novalidate>
        <input type="hidden" id="gameKey" name="game">

        <fieldset data-mode-fieldset>
          <legend>Play Mode</legend>
          <label class="mode-option">
            <input type="radio" name="mode" value="team" checked>
            <span>Team Mode</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="solo">
            <span>Solo Mode</span>
          </label>
        </fieldset>

        <div class="team-fields" data-team-fields>
          <label for="teamOne">Team 1 Name</label>
          <input id="teamOne" type="text" value="Team Mass" maxlength="24">

          <label for="teamTwo">Team 2 Name</label>
          <input id="teamTwo" type="text" value="Team Class" maxlength="24">
        </div>

        <p class="form-error" data-form-error role="alert"></p>
        <div class="action-row">
          <button class="button primary" type="submit">Start Game</button>
          <a class="button secondary" href="dashboard.html">Back</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/movies.js"></script>
  <script src="js/shuffle.js"></script>
  <script src="js/gameEngine.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
