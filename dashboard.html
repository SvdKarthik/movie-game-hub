<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Movie Game Hub</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">Movie Game Hub</a>
  </header>

  <main class="page">
    <section class="page-heading">
      <p class="eyebrow">Telugu Movie Guessing</p>
      <h1>Pick a Game</h1>
    </section>

    <section class="game-grid" aria-label="Available games">
      <a class="game-card charades-card" href="setup.html?game=charades">
        <span class="game-icon">🎭</span>
        <h2>Dumb Charades</h2>
        <p>Android tilt controls ready.</p>
      </a>
      <a class="game-card poster-card" href="setup.html?game=poster">
        <span class="game-icon">🖼️</span>
        <h2>Guess the Poster</h2>
        <p>Can you recognize the movie?</p>
      </a>
      <a class="game-card closeup-card" href="setup.html?game=closeup">
        <span class="game-icon">🔍</span>
        <h2>Close-Up Challenge</h2>
        <p>Guess from a small detail.</p>
      </a>
      <a class="game-card emoji-card" href="setup.html?game=emoji">
        <span class="game-icon">🧩</span>
        <h2>Emoji Movie Challenge</h2>
        <p>Decode the emojis.</p>
      </a>
    </section>
  </main>
</body>
</html>
